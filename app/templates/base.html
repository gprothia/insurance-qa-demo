<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Acme Mutual{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; color: #1f2937; }
    header { border-bottom: 3px solid #1a73e8; margin-bottom: 1.5rem; }
    label { display: block; margin-top: .75rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: .5rem; margin-top: .25rem; box-sizing: border-box; }
    button { margin-top: 1.25rem; padding: .6rem 1.2rem; background: #1a73e8; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .error { background: #fde8e8; color: #9b1c1c; padding: .75rem; border-radius: 4px; }
    .card { background: #f1f5f9; padding: 1rem; border-radius: 6px; }
    dt { font-weight: 600; } dd { margin: 0 0 .5rem 0; }
  </style>
</head>
<body>
  <header><h1>Acme Mutual</h1></header>
  {% if error %}<p class="error" role="alert" data-testid="error">{{ error }}</p>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
