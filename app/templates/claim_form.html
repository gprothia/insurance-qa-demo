{% extends "base.html" %}
{% block title %}File a claim · Acme Mutual{% endblock %}
{% block content %}
<h2>File a claim</h2>
<form method="post" action="/ui/claims">
  <label for="policy_id">Policy ID</label>
  <input id="policy_id" name="policy_id" value="{{ policy_id }}" required>

  <label for="incident_date">Incident date</label>
  <input id="incident_date" name="incident_date" type="date" value="{{ today }}" required>

  <label for="amount">Claim amount</label>
  <input id="amount" name="amount" type="number" min="0.01" step="0.01" required>

  <label for="description">What happened?</label>
  <textarea id="description" name="description" rows="3"></textarea>

  <button type="submit">Submit claim</button>
</form>
{% endblock %}
