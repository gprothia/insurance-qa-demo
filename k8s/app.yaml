apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: { app: acme-insurance }
spec:
  replicas: 1
  selector:
    matchLabels: { app: acme-insurance }
  template:
    metadata:
      labels: { app: acme-insurance }
    spec:
      containers:
        - name: app
          image: APP_IMAGE
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: { app: acme-insurance }
  ports:
    - port: 80
      targetPort: 8000
